replicaCount: 3
image:
  repository: ghcr.io/seungchan00/backend-api
  tag: 074a19e6fed9bf1df1637d77fc2a69a450f88f36
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
securityContext:
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
containerPort: 8080
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "2000"
    nginx.ingress.kubernetes.io/limit-connections: "1000"
  hosts:
    - host: prod.myapp.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300
httpRoute:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 15s
